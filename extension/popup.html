<!doctype html>
<!-- ASSUMPTION: static popup labels mirror src/core/templates.ts; the extension is plain JS
     and cannot import server TypeScript. Analysis text always comes from the API. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScamCheck</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <h1>ScamCheck</h1>
      <a href="options.html" target="_blank" class="settings" id="settings-link">Settings</a>
    </header>

    <label class="label" for="message">Message to check</label>
    <textarea id="message" rows="6" maxlength="6000" placeholder="Paste the message, email or listing here..."></textarea>
    <div class="counter" id="counter">0 / 6000</div>

    <div class="actions">
      <button id="check-button" class="btn btn-primary" type="button" disabled>Check</button>
      <button id="clear-button" class="btn" type="button">Clear</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section class="result" id="result" aria-live="polite"></section>

    <script src="popup.js"></script>
  </body>
</html>
