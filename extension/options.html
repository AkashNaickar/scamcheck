<!doctype html>
<!-- ASSUMPTION: static options labels mirror src/core/templates.ts where applicable. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScamCheck settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <h1>ScamCheck settings</h1>
    </header>

    <label class="label" for="backend">Backend URL</label>
    <input id="backend" type="url" value="http://localhost:8787" spellcheck="false" />
    <p class="counter">
      The address of your ScamCheck server. The API key stays on the server and is never stored here.
    </p>

    <div class="actions">
      <button id="save-button" class="btn btn-primary" type="button">Save</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <script src="options.js"></script>
  </body>
</html>
